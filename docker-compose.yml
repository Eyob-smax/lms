version: '3.8'

services:
  # 1. PostgreSQL Relational Database Service
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: always
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Redis Caching & BullMQ Queue Service
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. NestJS Backend API Service
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    container_name: lms-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CI: "true"
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://lms_user:lms_password@postgres:5432/lms_db?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      JWT_SECRET: "super-secret-jwt-key-change-in-production-bpo-lms"
      JWT_EXPIRATION: "7d"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-your_gemini_api_key_here}"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "pnpm exec prisma db push --schema=apps/backend/prisma/schema.prisma && pnpm exec ts-node apps/backend/prisma/seed.ts && pnpm exec nx serve backend"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Next.js Frontend UI Service
  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile.dev
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      CI: "true"
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "pnpm exec next dev apps/frontend -p 3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
